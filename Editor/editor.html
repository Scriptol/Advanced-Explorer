<html lang="en">
<head>
<title>Advanced Explorer Editor</title>
<link type="text/css" href="editor.css" rel="stylesheet">
<script src="src-min-noconflict/ace.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
<div id="main">
    <div id="recents">
        <div id="recbar">
            <div id="recentsClr" title="Clear all recents" onclick="clearRecents()" >X</div>
            <div id="recentsSort" title="Sort list" onclick="sortRecents()">&#8645;</div>
        </div>
        <div id="reclist"></div>
    </div>
    <div id="editpanel">
        <div id="toolbar">
            <div class="edicon" id="saveas" onClick="act(this)" title="Save as">&#128427;</div>
            <div class="edicon" id="new"  onClick="act(this)" title="New blank page">&#128459;</div>
            <div class="edicon" id="find" onClick="act(this)" title="Search  CTRL-F">&#128269;</div>
            <div class="edicon" id="replace" onClick="act(this)" title="Search & replace  CTRL-H">&#128221;</div>
            <div class="edicon" id="outdent" onClick="act(this)" title="Unindent  SHIFT-TAB">⇤</div>
            <div class="edicon" id="indent"  onClick="act(this)" title="Indent  TAB">⇥</div>
            <div class="edicon" id="cut"     onClick="act(this)" title="Cut  CTRL-X">✂</div>
            <div class="edicon" id="copy"    onClick="act(this)" title="Copy  CTRL-X">&#128458;</div>
            <div class="edicon" id="paste"   onClick="act(this)" title="Paste  CTRL-V">📋</div>
            <div class="edicon" id="undo"    onClick="act(this)" title="Undo  CTRL-Z">↶</div>
            <div class="edicon" id="redo"    onClick="act(this)" title="Redo  CTRL-Y">↷</div>
            <div class="tfield" id="filename"></div>
        </div>
        <div id="editor"></div>
    </div>
</div>
    
<script>
    
let editorHasContent = false;
const { contextBridge, ipcRenderer } = top.require('electron');
const remote = top.require('@electron/remote');
const { dialog } = remote;

let editor = ace.edit("editor");
let root;
let recents;
    

var languageExt = {
  "c": "c_cpp",
  "cpp": "c_cpp",
  "cs": "csharp",  
  "css": "css",
  "go": "golang",  
  "h": "c_cpp",
  "hpp": "c_cpp",  
  "ini": "ini",
  "java": "java",
  "jl": "julia",
  "js": "javascript",
  "json": "json",
  "html": "html",
  "php": "php",  
  "rss": "xml",
  "svg": "svg",      
  "py": "python",
  "rb": "ruby",
  "sql": "sql",  
  "ts": "javascript",
  "txt": "plain_text",                
  "xml": "xml"  
};

    editor.setTheme("ace/theme/dreamweaver");
    editor.getSession().setMode("ace/mode/html"); 
    var filename="";
    editor.getSession().on('change', 
        function() { 
            if(editorHasContent === false)
                changedStatus(true);
        }
    );
		
    editor.commands.addCommand( {
        name: 'saving',
        bindKey: {win: 'Ctrl-S',  mac: 'Command-S'},
        exec: function(editor) { save(false); }
    },
    {
        name: "find",
        bindKey: {
            win: "Ctrl-F",  mac: "Command-F"
        },
        exec: function(editor, needle) {
            if (typeof needle === "object") {
                var arg = this.name + " " + editor.getCopyText();
                editor.cmdLine.setValue(arg, 1);
                editor.cmdLine.focus();
                return;
            }
            editor.find(needle);
        }
    },
    {
        name: "gotoline",
        bindKey: {
            win: "Ctrl-L", mac: "Command-L"
        },
        exec: function(editor, line) {
            if (typeof line === "object") {
                var arg = this.name + " " + editor.getCursorPosition().row;
                editor.cmdLine.setValue(arg, 1);
                editor.cmdLine.focus();
                 return;
            }
            line = parseInt(line, 10);
            if (!isNaN(line))   editor.gotoLine(line);
        }
    }
);	

function updateStatusBar(message) { 
    parent.document.getElementById('status').innerHTML = message;
}

function setFileName(fname) {
    if(fname == undefined) return;
    filename = fname;
    if(fname != "") {
        var pos = fname.lastIndexOf("/");
        if(pos === -1) pos = fname.lastIndexOf("\\");
        if(pos > 0) fname = fname.substr(pos + 1);
    }
    var fno =  document.getElementById("filename")    
    fno.innerHTML = fname;
    fno.setAttribute("title", filename);
}

function editorIcon(actif) {
    var edicon = parent.document.getElementById('spanedit');
    if(actif) {
        edicon.innerHTML = "&#128462;";
    }    
    else  {
        edicon.innerHTML = "&#128459;";
        editor.setValue('');	        
    }    
}   

function newDoc() {
    editor.session.setValue("");
    editorIcon(false);  
    setFileName("");
    changedStatus(false);
    updateStatusBar("");
}

function clearDoc() {
    if(!editorHasContent) {
        newDoc();
        return
    }
    top.AESaveDialog(function(result) {
        if(result) {
            newDoc();
        }
    });
    return 
}

function displaySub(data) {
    editor.setValue(data.content, -1);
    var mode = "plain_text";
    if(data.ext in languageExt) {
        mode = "ace/mode/" + languageExt[data.ext];
    }    
    editor.getSession().setMode(mode);    
    var fname = data.filename;
    setFileName(fname);
    addToRecents(fname);
    changedStatus(false);
    updateStatusBar(filename);
    editorIcon(true);
    recentsDisplay();  
    editor.focus();   
}

function display(data) {       
    var configEd = parent.config.Editor; 
    editor.setTheme("ace/theme/" + configEd.list[0].input.toLowerCase());  
    var fontSize = parseInt(configEd.list[1].input);
    editor.setFontSize(fontSize);
    editor.getSession().setUseWrapMode(true);
    editor.setShowPrintMargin(false);
    if(data.content !== null)  {
        setActiveRow();
        if(!editorHasContent) {
            newDoc();
            displaySub(data)
            return;
        } 
        top.AESaveDialog(function(result) {
            if(result) {
                newDoc();
                displaySub(data)
            }
        });   
        return;
    }
    recentsDisplay();    
    editor.focus();   
}

function openDoc(filepath) {
    var a = { 
        'path' : filepath, 
        'command': 'getContent',
        'target': null,
        'inEditor': true 
    };
    ipcRenderer.send("interface", JSON.stringify( a));
}

function getActiveRow(fname) {
    for(var i = 0; i < recents.list.length; i++) {
        if(fname === recents.list[i][0])  return recents.list[i][1];
    }
    return 0;
}

function setActiveRow() {     
    if(filename === undefined || filename === "") return;
    for(var i = 0; i < recents.list.length; i++) {
        if(filename === recents.list[i][0])  {
            recents.list[i][1] = editor.getFirstVisibleRow();
            return;
        }  
    }
}

function extractDir(fullpath) {
    var p1 = fullpath.lastIndexOf("/");
    var p2 = fullpath.lastIndexOf("\\");
    if(p2 > p1) p1 = p2;
    return fullpath.substr(0, p1 + 1);
}

function extractFile(fullpath) {
    var p1 = fullpath.lastIndexOf("/");
    var p2 = fullpath.lastIndexOf("\\");
    if(p2 > p1) p1 = p2;
    return fullpath.substr(p1 + 1);
} 

function pathCompare(a, b) {
    if(a[1] == ":") {
        return a.toLowerCase() === b.toLowerCase();
    }
    return a === b;
}

function indexInRecents(fname)  {
    for(var i = 0; i < recents.list.length; i++) {
        if(pathCompare(recents.list[i][0], fname)) {
            return i;
        }    
    }
    return -1;    
} 


function addToRecents() {
    if(recents === null) {
        parent.config.Recents = {};
        parent.config.Recents.list=[];
    }
    recents = parent.config.Recents;    
    var pos = indexInRecents(filename);
    if(pos !== -1)
        recents.list.splice(pos, 1);  
    else {    
        if(recents.list.length > config.RECENTSMAX) recents.list.pop();
    }
    recents.list.unshift([filename, editor.getFirstVisibleRow()]);
}

function removeFromRecents(filename) {
    var pos = indexInRecents(filename);
    if(pos === -1) return;
    recents.list.splice(pos, 1);    
    recentsDisplay();
}

let config = window.parent.config;

function recentsDisplay() {
    var div = document.getElementById("reclist");
    div.innerHTML = ""
/*
    if (config.sortRecents) {
        recents.list.sort((a, b) => {
            const fa = a[0].split(/[/\\]/).pop();
            const fb = b[0].split(/[/\\]/).pop();
            return fa.localeCompare(fb);
        });
    }
*/
    let displayList = recents.list;
    if (config.sortRecents) {
        displayList = [...recents.list].sort((a, b) => {
            const fa = a[0].split(/[/\\]/).pop();
            const fb = b[0].split(/[/\\]/).pop();
            return fa.localeCompare(fb);
        });
    }

    for(let i = 0; i < displayList.length; i++) {
        let path = displayList[i][0];
        let row  = displayList[i][1];

        const p = document.createElement("p");
        const fname = path.split(/[/\\]/).pop();
        let flag = pathCompare(filename, path);
        p.title = path;
        p.dataset.row = row;
        p.className = "recent-entry";
        if(flag) p.classList.add("bold")

        const textSpan = document.createElement("span");
        textSpan.textContent = fname;  
        textSpan.onclick = (event) => {
            event.stopPropagation();  
            const fullPath = event.currentTarget.parentElement.title;
            openDoc(fullPath); 
            filename = fullPath;
            editor.gotoLine('+row+',0)
        };      

        const trash = document.createElement("span");
        trash.innerHTML = "&#128465;"; 
        trash.className = "trash-icon";
        trash.onclick = (event) => {
            event.stopPropagation();  
            removeFromRecents(path);
        };    
    
        p.appendChild(textSpan);
        p.appendChild(trash);
        div.appendChild(p);        
    }
}


function clearRecents() {
    recents.list=[];
    recentsDisplay();
}

function sortRecents() {
    config.sortRecents = !config.sortRecents;
    const r = document.getElementById("recentsSort");
    r.classList.toggle("active", config.sortRecents);
    recentsDisplay();
}


/* Shell */

function act(element) {
    var command = element.id;
    var temp;
    switch(command) {
        case "new":	      
            clearDoc();	
            break;
        case "indent":		
            editor.indent();	
            break;	
        case "outdent":		
            editor.blockOutdent();	
            break;					
        case "cut": 
            editorMyClipboard = editor.getCopyText();
            editor.remove(); 
            break;	
        case "copy":	
             editorMyClipboard = editor.getCopyText();
            break;	
        case "paste":
             editor.insert(editorMyClipboard);
            break;	
        case "set":
        case "clear":
            editorIcon(false);
            break;
        case "saveas":
            save(true);
	       break;
        case "find":
            editor.execCommand("find")
            break;
        case "replace":
            editor.execCommand("replace")
            break;
        case "next":	
            editor.findNext();
            break;
        case "undo":
            editor.undo();
            break;	
        case "redo":
            editor.redo();
            break;	
        default:
            alertDialog("Unknown command");
        }			
        editor.focus();
}

function changedStatus(status) {
    var chg = document.getElementById("filename");
    if(status)
        chg.style.color="orange";
    else
        chg.style.color="white";		
    editorHasContent = status;  
}

function editDoc(data) {
    setFileName(data.filename);
    editor.setValue(data.content, -1);
    var mode = "plain_text";
    if(data.ext in languageExt) {   
        mode = "ace/mode/" + languageExt[data.ext];
    }    
    editor.getSession().setMode(mode); 
    var row = getActiveRow(filename);   
    editor.scrollToLine(row);
    changedStatus(false);
    editorIcon(true);
    addToRecents(data.filename);
    recentsDisplay();
    editor.focus();
}

ipcRenderer.on("editor", (event, data) => {
    var data = JSON.parse(data);
    switch(data.type)  {
    case "openDoc":
        setActiveRow();
        if(!editorHasContent) {
            editDoc(data)
            return
        } 
        // ask to cancel or replace, save before or not
        top.AESaveDialog(function(result) {
            if(result) editDoc(data)
            return
        });
        break
    case "confirm":
        if(data.action == "confirm") {
		    var p = confirm(data.message);
            var a = {
                "type":"answer", "data": data        
            }
            ipcRenderer.send("interface", JSON.stringify(a));
        }
        break;
    case "message":    
        alertDialog(data.message);
        break;
    case "mouse":
        break;  
    case "status":  
        updateStatusBar(data.content);   
        break;    
    default:
        alertDialog("Unknow message '" + data.type + "' in editor");
        break;    
    }
});

var winsave = function() {
    var filepath = dialog.showSaveDialogSync(null, {
        title:"Save current text in a file",
        defaultPath: filename,
        buttonLabel: "Save"
    })

    if(filepath && filepath.length > 0) {
        return filepath;
    }     
 
    return "";  // abort
}

function save(pflag) { 
    var content = editor.getValue();
    if(content.length === 0) {
        alertDialog("Nothing to save.")
        return; 
    }  
    if(pflag || filename === undefined || filename === "") {
        var x = winsave() 
        if(x == "") {
            updateStatusBar("Content not saved");
            return;
        }
        setFileName(x);
    }
    else {
        editor.focus();
    }    
    setActiveRow();
    updateStatusBar(x);
    changedStatus(false);
    var a = { 
        'command': 'save', 
        'filename': filename, 
        'content' : content,
        'overwrite' : true 
    };
    ipcRenderer.send("interface", JSON.stringify(a));
}

window.onload=function() {
    recents = parent.config.Recents; 
    if(parent.config.sortRecents)  {
        document.getElementById("recentsSort").classList.add("active")
    }
}

</script>

</body>
</html>
