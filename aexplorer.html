<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<title>Advanced Explorer</title>
<link rel="stylesheet" href="code/aexplorer.css"> 
<base href="./">
<script type="text/javascript" src="code/chooser.js"></script>
<script type="text/javascript" src="aexplorer.ini.js"></script>
<script type="text/javascript" src="code/exif.js"></script>
<script type="text/javascript" src="code/aecode.js"></script>
</head>

<body>
<div id="aexplorer">
<div id="outer">
<div class="toolbar" id="topbar"> 
<div class="tbicon" id='tinvert' title="Invert left and right panels"><span>&hArr;</span></div>
<div class="tbicon" id='tdup' title="Display left on right too"><span>&rArr;</span></div>

<div class="tbicon" id='tcomp' title="Compare directories"><span class="dirside">&#128458;</span><span class="tbrside">?</span></div>
<div class="tbicon" id='tcopy' title="Copy selected files/dirs to right window"><span class="tblside">&#128462;</span><span class="tbrside">&#128459;</span></div>
<div class="tbicon" id='tcopyren' title="Copy a file or dir with a new name"><span class="tblside">&#128462;</span><span class="tbren">xy</span></div> 
<div class="tbicon" id='tsync' title="Synchronize target with source"><span class="dirside">&#128458;</span><span class="tbrside">=</span></div>

<div class="tbicon" title="Make a zip archive" onclick="topZip()"><span class="bkside">&#128217;</span><span class="tblabel">zip</span></div>
<div class="tbicon" id='tedit' title="Open/Close the editor"><span id="spanedit">&#128459;</span><span class="tbelabel">&#128393;</span></div>


<div class="tbright">
<div class="tbicon" id='topt' title="Setting up A.E."><span>&#128736;</span></div>

<div id="thelp" class="tbicon insert">
  <span  title="Help">❓</span>
  <div class="comlist" unselectable="on">
      <p class="item"><b>Advanced Explorer</b></p>
      <p class="item">Version 7.2</p>
      <p class="item">&copy; 2001-2026 D. Sureau</p>
      <p class="item" data-type="helpen"><a href="https://www.scriptol.com/scripts/advanced-explorer-manual.php">English manual</a></p>
      <p class="item" data-type="helpfr"><a href="https://www.scriptol.fr/scripts/advanced-explorer-manuel.php">Manuel français</a></p>  
  </div>
</div>

<div class="tbicon" id="tquit" title="Save all and close A.E.">
<svg viewBox="0 0 32 32" width="22" height="22" class="quit-svg">
    <rect width="32" height="32" rx="7" />
    <g stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M 11 12 A 7 7 0 1 0 21 12" />
      <line x1="16" y1="7" x2="16" y2="15" />
    </g>
</svg>
</div>

</div> 
</div> <!--toolbar-->

<div id="dirpane">
<div id="lpane">
  <div class="toolpane" id="lcontrol">
	<div class="panicon" id="lup" title="Up to parent dir">⬆</div>
	<div class="panicon" id="lhome" title="Up to root dir">🔝</div>	
	<div class="panicon" id="lreload" title="Refresh">⟳</div>	
    <div class="panicon" id="lcreate" title="Create a subdirectory">&#128193;</div>
    <div class="panicon" id="ldel" title="Delete selected files and dirs">❌</div>  
    <div class="panicon" id="lbox" title="Open a box of apps">&#128230;</div>
  </div>
  <div class="fullpath">
   <div class="fsroot">
     <span class="fsimg" onclick="computer('l')">&#128187;</span>
       <div class="bmlist" id="lbm"></div>
   </div>

    <div class="fspath" oncontextmenu="return false">
      <input type="text" class="innpath" id="lcontentpath" value="/"  
           oncontextmenu="return addListMenu(this, 'lcontent')">
      <div id="recentArrow" data-code="0" class="farrow" onclick="toggleRecentList(this)">&#9662;</div>
      <div id="lstar" class="fstar" onClick="bookmark('l')">&#9734;</div>
    </div>


  </div>
  <div id="lcontent"></div>
</div>

<div id="rpane">
  <div class="toolpane" id="rcontrol">
	<div class="panicon" id="rup" title="Up to parent dir">⬆</div>
	<div class="panicon" id="rhome" title="Up to root dir">🔝</div>	
	<div class="panicon" id="rreload" title="Refresh">⟳</div>
    <div class="panicon" id="rcreate" title="Create a subdirectory">&#128193;</div>
    <div class="panicon" id="rdel" title="Delete selected files and dirs">❌</div>  
    <div class="panicon" id="rbox" title="Open a box of apps">&#128230;</div>    
  </div>
  <div class="fullpath"> 
    <div class="fsroot">
        <span class="fsimg" onclick="computer('r')">&#128187;</span>
         <div class="bmlist" id="rbm"></div>
    </div>

    <div class="fspath" oncontextmenu="return false">
      <input type="text" class="innpath" id="rcontentpath" value="/"  
           oncontextmenu="return addListMenu(this, 'rcontent')">
      <div class="farrow" data-code="1" onclick="toggleRecentList(this)">&#9662;</div>
      <div id="rstar" class="fstar" onClick="bookmark('r')">&#9734;</div>
    </div>

  </div>
  <div id="rcontent"></div> 	  
</div>

</div> <!--dirpane-->

<div id="editpane" style="display:none">
  <div style="width:100%;height:100%;position:relative; padding:0px; display:block;overflow:hidden">
    <iframe name="editor" id="editor" src="Editor/editor.html" scrolling="no"></iframe>
  </div>
</div> <!--editpane-->

<div id="optpane" style="display:none">
  <div style="width:100%;height:100%;position:relative; padding:0px; display:block;overflow:hidden">
    <iframe name="options" id="options" src="configurator.html"></iframe>
  </div>
</div> <!--confpane-->

</div> <!--outer-->
<div id="statubar">
  <div id="outerstatus">
	<div id="status">Welcome...</div>
  </div>	
</div>
</div> <!--explorer-->
<div id="dCont"></div>
<script>

function startExplorer() {
    ChooserDrag = AExplorerDrag;
    if(!config) {
        alertDialog("&#9785; Config file missing. Copy config.model to aexplorer.ini.js")
    }  
    var lpath = config.Memory.list[0].input;
    var rpath = config.Memory.list[1].input;
    if(lpath == '') { 
        lpath = "/"; 
        rpath = "/"; 
    }
    if(!config.RECENTSMAX) {
      config.RECENTSMAX = 32
    }
    currentpath['lcontent'] = lpath;
    currentpath['rcontent'] = rpath;	
    fileButton('lcontent', true);
    fileButton('rcontent', false);
    buildEvents(); 
}


function quitSub() {
  config.Memory.list[0].input = currentpath['lcontent'];
  config.Memory.list[1].input = currentpath['rcontent'];
  var frameopt = document.getElementById("options");
  var fo = (frameopt.contentWindow || frameopt.contentDocument);
  fo.saveFromAE('aexplorer.ini.js', config);    
  sendFromInterface({ 'command': 'quit' });
  setTimeout(function() { this.close();}, 100);
}

function exitExplorer() {
  var framedit = document.getElementById("editor");
	var fc = (framedit.contentWindow || framedit.contentDocument);
  fc.setActiveRow();
  if(!fc.editorHasContent) {
    quitSub();
    return
  }
  AESaveDialog(function(result) {
    if(result) {
      quitSub();
    }
  });
  return   
}

window.onload=startExplorer;
</script>
</body>
</html>
